plugins {
    id 'com.android.application'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'com.example.foliodimmer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.foliodimmer'
        minSdkVersion 22
        targetSdkVersion 22
        versionCode 2
        versionName '0.16.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


