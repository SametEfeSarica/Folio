plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.foliodimmer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.foliodimmer'
        minSdkVersion 22
        targetSdkVersion 22
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


